env: dev

http:
  host: 0.0.0.0
  port: 8080
  read_timeout: 5s
  write_timeout: 10s
  idle_timeout: 60s

postgres:
  host: localhost
  port: 5432
  database: medtech
  user: kishman
  password: kishman
  ssl_mode: disable

  max_open_conns: 20
  max_idle_conns: 10
  max_conn_lifetime: 30m
  max_conn_idle_time: 10m

redis:
  host: localhost
  port: 6379
  password: ""
  db: 0

minio:
  endpoint: localhost:9000
  access_key: minioadmin
  secret_key: minioadmin
  use_ssl: false
  presign_ttl_seconds: 120
  bucket_consents: medtech-consents
  bucket_attachments: medtech-attachments

clickhouse:
  host: localhost
  port: 8123
  database: medtech_analytics
  user: default
  password: ""

ml:
  endpoint: http://127.0.0.1:8080
  timeout: 3s

rabbitmq:
  url: amqp://guest:guest@localhost:5672/
  queue: medtech.notifications

logging:
  level: debug
  format: json
